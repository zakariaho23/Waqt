name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Publish Standalone Executable (x64)
      run: |
        dotnet publish Waqt.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o ./publish-standalone
        Compress-Archive -Path ./publish-standalone/Waqt.exe -DestinationPath ./Waqt-Standalone-win-x64.zip

    - name: Publish Framework-Dependent Executable (x64)
      run: |
        dotnet publish Waqt.csproj -c Release -r win-x64 --self-contained false -p:PublishSingleFile=true -o ./publish-portable
        Compress-Archive -Path ./publish-portable/Waqt.exe -DestinationPath ./Waqt-Portable-win-x64.zip

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        name: Waqt ${{ github.ref_name }}
        draft: false
        prerelease: false
        generate_release_notes: true
        files: |
          ./Waqt-Standalone-win-x64.zip
          ./Waqt-Portable-win-x64.zip
